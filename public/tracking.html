<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load Tracking | Dispatcher365</title>
  <meta name="theme-color" content="#101923" />
  <meta name="application-name" content="Dispatcher365" />
  <meta name="apple-mobile-web-app-title" content="Dispatcher365" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css?v=theme-icons-home" />
</head>
<body class="tracking-body">
  <main class="tracking-shell">
    <section class="tracking-card">
      <div class="tracking-brand">
        <a href="/" class="tracking-brand-link"><span>D365</span><strong>Dispatcher365</strong></a>
        <nav class="tracking-brand-actions" aria-label="Tracking navigation">
          <a href="/" class="tracking-home-link">Home</a>
          <a href="/portal">Log In</a>
        </nav>
      </div>
      <div id="trackingRoot" class="tracking-content">
        <p class="eyebrow">Customer Tracking</p>
        <h1>Track your shipment.</h1>
      </div>
    </section>
  </main>
  <script>
    const root = document.getElementById('trackingRoot');
    const pathParts = location.pathname.split('/').filter(Boolean);
    const pathId = pathParts[0] === 'track' && pathParts[1] ? pathParts.slice(1).join('/') : '';
    const queryId = new URLSearchParams(location.search).get('id') || '';
    const initialTrackingId = decodeURIComponent(pathId || queryId || '');
    const statusLabels = {
      new: 'Created',
      assigned: 'Assigned',
      accepted: 'Accepted',
      en_route_pickup: 'En Route To Pickup',
      at_pickup: 'At Pickup',
      picked_up: 'Picked Up',
      in_transit: 'In Transit',
      at_delivery: 'At Delivery',
      delivered: 'Delivered',
      exception: 'Exception',
      cancelled: 'Cancelled'
    };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
    const fmt = value => value ? new Date(value).toLocaleString() : 'Not scheduled';
    const label = status => statusLabels[status] || String(status || 'new').replaceAll('_', ' ');
    const statusClass = status => String(status || 'new').replace(/[^a-z0-9_-]/gi, '_').toLowerCase();
    const trackingForm = (value = '', message = '') => `
      <div class="tracking-lookup">
        <p class="eyebrow">Shipment Tracking</p>
        <h1>Track your shipment.</h1>
        <p>Enter the tracking/load number provided by dispatch.</p>
        <form id="trackingLookupForm" class="tracking-lookup-form">
          <label>Tracking ID<input name="trackingId" value="${esc(value)}" placeholder="Example: DEMO0001-2026-000001" autocomplete="off" required /></label>
          <button class="btn primary" type="submit">Track Shipment</button>
        </form>
        ${message ? `<p class="tracking-message">${esc(message)}</p>` : ''}
      </div>`;

    function render(load) {
      const events = [...(load.events || [])].sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
      root.innerHTML = `
        <div class="tracking-hero">
          <div>
            <p class="eyebrow">Customer Tracking</p>
            <h1>Load ${esc(load.loadNumber)}</h1>
            <p>${esc(load.customer || 'Shipment status')}</p>
          </div>
          <span class="tracking-status ${statusClass(load.status)}">${esc(label(load.status))}</span>
        </div>
        <div class="tracking-progress">
          ${['assigned','en_route_pickup','picked_up','in_transit','at_delivery','delivered'].map(step => `<span class="${events.some(event => event.status === step) || load.status === step ? 'done' : ''}">${esc(label(step))}</span>`).join('')}
        </div>
        <div class="tracking-grid">
          <article>
            <span>Pickup</span>
            <strong>${esc(load.pickupName || 'Pickup')}</strong>
            <p>${esc(load.pickupAddress || 'Address pending')}</p>
            <small>${fmt(load.pickupAppointment)}</small>
          </article>
          <article>
            <span>Delivery</span>
            <strong>${esc(load.deliveryName || 'Delivery')}</strong>
            <p>${esc(load.deliveryAddress || 'Address pending')}</p>
            <small>${fmt(load.deliveryAppointment)}</small>
          </article>
        </div>
        <div class="tracking-details">
          <div><span>Reference</span><strong>${esc(load.referenceNumber || 'Not provided')}</strong></div>
          <div><span>Commodity</span><strong>${esc(load.commodity || 'Not provided')}</strong></div>
          <div><span>Pieces</span><strong>${esc(load.pieces || 'Not provided')}</strong></div>
          <div><span>Last Updated</span><strong>${fmt(load.updatedAt)}</strong></div>
        </div>
        <section class="tracking-section">
          <h2>Status History</h2>
          <div class="tracking-timeline">
            ${events.map(event => `<div><span></span><strong>${esc(label(event.status))}</strong><p>${esc(event.note || '')}</p><small>${fmt(event.at)}</small></div>`).join('') || '<p>No status updates yet.</p>'}
          </div>
        </section>
        <section class="tracking-section">
          <h2>Documents</h2>
          <div class="tracking-docs">
            ${(load.documents || []).map(doc => `<a href="${esc(doc.url)}" target="_blank" rel="noopener"><strong>${esc(doc.type || 'Document')}</strong><span>${esc(doc.note || 'View uploaded file')}</span><small>${fmt(doc.uploadedAt)}</small></a>`).join('') || '<p>No customer documents uploaded yet.</p>'}
          </div>
        </section>`;
    }

    async function init() {
      const trackingId = initialTrackingId.trim();
      if (!trackingId) {
        root.innerHTML = trackingForm();
        bindLookupForm();
        return;
      }
      try {
        const res = await fetch(`/api/public/loads/${encodeURIComponent(trackingId)}`);
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'Tracking link not found');
        render(body);
      } catch (error) {
        root.innerHTML = trackingForm(trackingId, error.message);
        bindLookupForm();
      }
    }
    function bindLookupForm() {
      const form = document.getElementById('trackingLookupForm');
      if (!form) return;
      form.addEventListener('submit', event => {
        event.preventDefault();
        const id = new FormData(form).get('trackingId').trim();
        if (id) window.location.href = `/track/${encodeURIComponent(id)}`;
      });
    }
    init();
  </script>
</body>
</html>
