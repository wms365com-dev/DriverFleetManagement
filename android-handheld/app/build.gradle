plugins {
    id "com.android.application"
}

android {
    namespace "co.dispatcher365.handheld"
    compileSdk 35

    defaultConfig {
        applicationId "co.dispatcher365.handheld"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "DEFAULT_PORTAL_URL", "\"https://dispatcher365.co/portal\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
